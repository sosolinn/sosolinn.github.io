<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabNote · 实验记录助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar"><div class="brand">🧪 <strong>LabNote</strong><small>实验记录助手</small></div><nav><a class="active">工作台</a><a>实验记录</a><a>数据统计</a><a>设置</a></nav></aside>
<main class="main-content">
<section class="welcome"><div><p>LABORATORY WORKSPACE</p><h1>欢迎回来，开始记录今天的实验</h1><span>集中管理样本、操作流程和实验结果。</span></div><time id="currentDate"></time></section>
<section class="stats-grid"><div>总记录数<strong id="totalRecords">0</strong></div><div>本周新增<strong id="weeklyRecords">0</strong></div><div>最近实验日期<strong id="latestExperimentDate">暂无</strong></div></section>
<div class="content-grid">
<section class="panel form-panel"><h2>新建实验记录</h2><form id="recordForm">
<div class="row"><label>样本名称<input id="sampleName" required placeholder="例如：HepG2细胞球A1"></label><label>实验日期<input id="experimentDate" type="date" required></label></div>
<label>实验操作<textarea id="experimentOperation" rows="8" required placeholder="请输入实验步骤、实验条件、处理方法、关键操作参数等..."></textarea></label>
<label>实验备注<textarea id="experimentNotes" rows="4" placeholder="记录观察结果或下一步计划"></textarea></label>
<button type="submit">＋ 保存实验记录</button></form></section>
<section class="panel records-panel"><h2>最近实验记录</h2><span id="recordCountLabel">0 条记录</span><div id="emptyState">暂无实验记录</div><div id="recordsList"></div></section>
</div>
</main></div>
<div id="toast"></div><script src="script.js"></script>
</body></html>
